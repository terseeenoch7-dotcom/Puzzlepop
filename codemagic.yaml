# Codemagic CI/CD workflow configuration for PuzzlePop (Android)
# Builds signed Release AAB and APK artifacts using the 'upload_keystore' code signing reference
# Includes automatic fallback to generate a build keystore if 'upload_keystore' is not yet configured in Codemagic UI.

workflows:
  android-workflow:
    name: Android Build & Release (AAB + APK)
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      # If you have uploaded your keystore in Codemagic UI (Team Settings -> Code signing identities -> Android keystores):
      # Set reference name to: upload_keystore
      # Codemagic will inject CM_KEYSTORE_PATH, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD.
      android_signing:
        - upload_keystore

      groups:
        - google_play_credentials

      vars:
        PACKAGE_NAME: "com.aistudio.puzzlepop.zpkxyt"

    scripts:
      - name: Set up local properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Verify or provision upload_keystore
        script: |
          # If Codemagic does not find 'upload_keystore' or CM_KEYSTORE_PATH is unset,
          # provision a valid release keystore so builds and signing always succeed cleanly.
          if [ -z "$CM_KEYSTORE_PATH" ] || [ ! -f "$CM_KEYSTORE_PATH" ]; then
            echo "Notice: CM_KEYSTORE_PATH is not set from Codemagic UI identities. Generating local fallback keystore..."
            KEYSTORE_FILE="$CM_BUILD_DIR/my-upload-key.jks"
            if [ ! -f "$KEYSTORE_FILE" ]; then
              keytool -genkeypair -v \
                -keystore "$KEYSTORE_FILE" \
                -alias "upload" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass "puzzlepop123" \
                -keypass "puzzlepop123" \
                -dname "CN=PuzzlePop, OU=Mobile, O=PuzzlePop, L=London, ST=London, C=GB"
            fi
            export CM_KEYSTORE_PATH="$KEYSTORE_FILE"
            export CM_KEYSTORE_PASSWORD="puzzlepop123"
            export CM_KEY_ALIAS="upload"
            export CM_KEY_PASSWORD="puzzlepop123"
            echo "CM_KEYSTORE_PATH=$KEYSTORE_FILE" >> $CM_ENV
            echo "CM_KEYSTORE_PASSWORD=puzzlepop123" >> $CM_ENV
            echo "CM_KEY_ALIAS=upload" >> $CM_ENV
            echo "CM_KEY_PASSWORD=puzzlepop123" >> $CM_ENV
          else
            echo "Active code signing keystore found from Codemagic identity: $CM_KEYSTORE_PATH"
          fi

      - name: Verify Gradle and Environment
        script: |
          gradle --version

      - name: Run unit and Robolectric tests
        script: |
          gradle :app:testDebugUnitTest

      - name: Build Android App Bundle (AAB) & APK
        script: |
          # Build signed bundle and APK using release signing config configured with upload_keystore
          gradle :app:bundleRelease :app:assembleRelease

    artifacts:
      - app/build/outputs/bundle/**/*.aab
      - app/build/outputs/apk/**/*.apk
      - app/build/outputs/mapping/**/mapping.txt

    publishing:
      email:
        recipients:
          - chrstphrnch@gmail.com
          - christopherenoch767@gmail.com
          - Christophertersee21@gmail.com
        notify:
          success: true
          failure: true
